<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meridian Loan Tracker</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.3.0/tabler-icons.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- LOGIN PAGE -->
  <div id="page-login" class="page active">
    <div class="login-bg">
      <div class="login-card">
        <div class="login-logo">
          <i class="ti ti-building-bank"></i>
        </div>
        <h1 class="login-title">Meridian</h1>
        <p class="login-sub">Loan Process Tracker</p>

        <div id="login-error" class="login-error hidden"></div>

        <div class="field">
          <label for="login-username">Username</label>
          <div class="input-icon">
            <i class="ti ti-user"></i>
            <input type="text" id="login-username" placeholder="Enter your username" autocomplete="username" />
          </div>
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <div class="input-icon">
            <i class="ti ti-lock"></i>
            <input type="password" id="login-password" placeholder="Enter your password" autocomplete="current-password" />
          </div>
        </div>
        <button class="btn-login" id="btn-login">
          Sign in <i class="ti ti-arrow-right"></i>
        </button>
        <p class="login-hint">Demo: <strong>admin / admin123</strong> &nbsp;|&nbsp; <strong>derick / pass123</strong></p>
      </div>
    </div>
  </div>

  <!-- MAIN APP PAGE -->
  <div id="page-app" class="page">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="sidebar-logo">
          <i class="ti ti-building-bank"></i>
          <span>Meridian</span>
        </div>
        <button class="sidebar-close" id="sidebar-close"><i class="ti ti-x"></i></button>
      </div>

      <nav class="sidebar-nav">
        <a href="#" class="nav-item active" data-view="dashboard">
          <i class="ti ti-layout-dashboard"></i> Dashboard
        </a>
        <a href="#" class="nav-item" data-view="loans">
          <i class="ti ti-file-dollar"></i> All Loans
        </a>
        <a href="#" class="nav-item" data-view="my-loans" id="nav-my-loans">
          <i class="ti ti-user-check"></i> My Loans
        </a>
        <a href="#" class="nav-item admin-only hidden" data-view="officers">
          <i class="ti ti-users"></i> Officers
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-pill" id="sidebar-user">
          <div class="user-avatar" id="sidebar-avatar"></div>
          <div class="user-info">
            <div class="user-name" id="sidebar-name"></div>
            <div class="user-role" id="sidebar-role"></div>
          </div>
        </div>
        <button class="btn-logout" id="btn-logout" title="Sign out">
          <i class="ti ti-logout"></i>
        </button>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="main-content">
      <div class="topbar">
        <button class="hamburger" id="hamburger"><i class="ti ti-menu-2"></i></button>
        <div class="topbar-title" id="topbar-title">Dashboard</div>
        <button class="btn-new-loan" id="btn-new-loan">
          <i class="ti ti-plus"></i> New loan
        </button>
      </div>

      <!-- DASHBOARD VIEW -->
      <div id="view-dashboard" class="view active">
        <div class="stats-grid" id="stats-grid"></div>
        <div class="section-header">
          <h2>Recent activity</h2>
        </div>
        <div id="recent-loans"></div>
      </div>

      <!-- ALL LOANS VIEW -->
      <div id="view-loans" class="view">
        <div class="toolbar">
          <div class="search-bar">
            <i class="ti ti-search"></i>
            <input type="text" id="search-all" placeholder="Search name, account, officer…" />
          </div>
          <div class="filter-chips" id="filter-chips"></div>
        </div>
        <div id="all-loans-list"></div>
      </div>

      <!-- MY LOANS VIEW -->
      <div id="view-my-loans" class="view">
        <div class="toolbar">
          <div class="search-bar">
            <i class="ti ti-search"></i>
            <input type="text" id="search-my" placeholder="Search your loans…" />
          </div>
        </div>
        <div id="my-loans-list"></div>
      </div>

      <!-- OFFICERS VIEW (admin only) -->
      <div id="view-officers" class="view">
        <div id="officers-list"></div>
      </div>
    </main>
  </div>

  <!-- LOAN MODAL -->
  <div id="loan-modal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title">New loan application</h3>
        <button class="modal-close" id="modal-close"><i class="ti ti-x"></i></button>
      </div>
      <div class="modal-body">
        <div class="field-row">
          <div class="field">
            <label>Customer name</label>
            <input type="text" id="m-name" placeholder="Full name" />
          </div>
          <div class="field">
            <label>Account number</label>
            <input type="text" id="m-acct" placeholder="ACC-XXXXXX" />
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Loan officer</label>
            <input type="text" id="m-officer" placeholder="Assigned officer" />
          </div>
          <div class="field">
            <label>Branch</label>
            <select id="m-branch">
              <option>Castries Main</option>
              <option>Vieux Fort</option>
              <option>Gros Islet</option>
              <option>Soufrière</option>
              <option>Micoud</option>
            </select>
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Loan amount (XCD)</label>
            <input type="number" id="m-amount" placeholder="e.g. 50000" />
          </div>
          <div class="field">
            <label>Loan type</label>
            <select id="m-type">
              <option>Personal</option>
              <option>Mortgage</option>
              <option>Business</option>
              <option>Auto</option>
              <option>Education</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label>Current stage</label>
          <select id="m-stage">
            <option value="0">1 · Application received</option>
            <option value="1">2 · Document review</option>
            <option value="2">3 · Credit assessment</option>
            <option value="3">4 · Underwriting</option>
            <option value="4">5 · Approval</option>
            <option value="5">6 · Disbursement</option>
          </select>
        </div>
        <div class="field">
          <label>Notes <span style="font-weight:400;color:#888">(optional)</span></label>
          <textarea id="m-notes" rows="2" placeholder="Any remarks…"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" id="modal-cancel">Cancel</button>
        <button class="btn-primary" id="modal-save">Save loan</button>
      </div>
    </div>
  </div>
<script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
<script src="js/msalConfig.js"></script>

  
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
